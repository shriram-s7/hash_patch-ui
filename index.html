<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRATYAKSHA-UI</title>
    <script>
      // Applied synchronously, before first paint, so there is no
      // flash of the wrong theme. Same storage key / logic the in-app
      // theme toggle (src/theme.ts) uses after mount.
      (function () {
        var stored = localStorage.getItem('pratyaksha-ui-theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
